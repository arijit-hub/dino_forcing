[project]
name = "dino-forcing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.10.1",
    "av>=16.0.1",
    "diffevals",
    "diffusers>=0.35.1",
    "einops>=0.8.1",
    "ema-pytorch>=0.7.7",
    "fastapi>=0.141.1",
    "hpsv2>=1.2.0",
    "huggingface-hub>=0.35.1",
    "hydra-core>=1.3.2",
    "image-reward",
    "imageio[ffmpeg]>=2.37.0",
    "lightning>=2.5.5",
    "matplotlib>=3.10.6",
    "numpy>=2.3.3",
    "open-clip-torch>=2.32.0",
    "opencv-python>=4.11.0.86",
    "prdc>=0.2",
    "protobuf>=3.20.3",
    "python-multipart>=0.0.32",
    "scipy>=1.16.2,<1.18",
    "seaborn>=0.13.2",
    "sentencepiece>=0.2.1",
    "timm==1.0.13",
    "tokenizers>=0.22.2",
    "torch==2.8",
    "torchmetrics[image]>=1.8.2",
    "torchshow>=0.5.2",
    "tqdm>=4.67.1",
    "transformers>=4.57.0,<5",
    "uvicorn[standard]>=0.53.0",
    "wandb>=0.22.0",
    "webdataset>=1.0.2",
]

[tool.uv]
cache-dir = "./.uv_cache"
extra-build-dependencies = { "image-reward" = ["setuptools<71"], "clip" = ["setuptools<71"] }

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."
module-name = "src"

[tool.uv.sources]
hpsv2 = { git = "https://github.com/tgxs002/HPSv2.git" }
image-reward = { git = "https://github.com/zai-org/ImageReward.git" }
diffevals = { git = "https://github.com/lucasdegeorge/DiffEvals.git" }
